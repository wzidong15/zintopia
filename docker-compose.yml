services:
  zintopia:
    build: .
    image: zintopia:local
    ports:
      - "8000:8000"
    environment:
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      MASSIVE_API_BASE_URL: ${MASSIVE_API_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ZINTOPIA_LIVE_REFRESH_SEC: ${ZINTOPIA_LIVE_REFRESH_SEC:-10}
      ZINTOPIA_CHART_REFRESH_SEC: ${ZINTOPIA_CHART_REFRESH_SEC:-30}
      ZINTOPIA_NEWS_REFRESH_SEC: ${ZINTOPIA_NEWS_REFRESH_SEC:-60}
      ZINTOPIA_MARKET_NEWS_REFRESH_SEC: ${ZINTOPIA_MARKET_NEWS_REFRESH_SEC:-}
      ZINTOPIA_TICKER_NEWS_REFRESH_SEC: ${ZINTOPIA_TICKER_NEWS_REFRESH_SEC:-}
      ZINTOPIA_STRATEGY_INTERVAL_SEC: ${ZINTOPIA_STRATEGY_INTERVAL_SEC:-3600}
      ZINTOPIA_HTTP_POOL_SIZE: ${ZINTOPIA_HTTP_POOL_SIZE:-20}
      ZINTOPIA_DATA_DIR: /data
      ZINTOPIA_STATIC_DIR: /app/ui
    # Host files are owned by your login; the image user is uid 10001 and cannot
    # write them. Root in the container is fine for this local research app.
    # Linux: ZINTOPIA_UID=$(id -u) ZINTOPIA_GID=$(id -g) docker compose up
    user: "${ZINTOPIA_UID:-0}:${ZINTOPIA_GID:-0}"
    volumes:
      - ${ZINTOPIA_HOST_DATA_DIR:-${HOME}/.zintopia}:/data
    restart: unless-stopped
